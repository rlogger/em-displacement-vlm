name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install uv -e ".[torch,vlm,dev]"
      - name: Lint
        run: python -m ruff check src scripts tests
      - name: Validate truthful workflow contract
        run: python scripts/validate_workflow.py
      - name: Test
        run: python -m pytest -q
      - name: Tiny smoke
        run: python scripts/smoke_test.py --config configs/smoke.yaml
      - name: Lockfile consistency
        run: uv lock --check
      - name: Validate notebooks are output-free JSON
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          notebooks = sorted(Path("notebooks").rglob("*.ipynb"))
          assert notebooks, "No notebooks found"
          for path in notebooks:
              notebook = json.loads(path.read_text(encoding="utf-8"))
              for index, cell in enumerate(notebook.get("cells", [])):
                  assert not cell.get("outputs", []), f"{path}: cell {index} has outputs"
                  assert cell.get("execution_count") is None, f"{path}: cell {index} has execution count"
          print(f"Validated {len(notebooks)} output-free notebooks")
          PY
      - name: Secret and terminology hygiene
        shell: bash
        run: |
          set -euo pipefail
          if rg --pcre2 -n --hidden -g '!.git/**' '(hf_[A-Za-z0-9]{20,}|wandb_v1_[A-Za-z0-9_]{20,}|gh[pousr]_[A-Za-z0-9]{20,}|sk-[A-Za-z0-9_-]{20,})' .; then
            echo "Potential credential detected."
            exit 1
          fi
          forbidden_term='te''rra'
          if rg -n -i --hidden -g '!.git/**' "$forbidden_term" .; then
            echo "Forbidden terminology detected."
            exit 1
          fi

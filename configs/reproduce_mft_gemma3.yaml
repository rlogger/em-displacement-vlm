run_name: reproduce_mft_gemma3_r32
seed: 42  # training / LoRA randomness; repeat as 42, 43, and 44
data_selection_seed: 42  # fixed immutable faces split shared by every training seed
seeds: [42, 43, 44]
model_id: unsloth/gemma-3-4b-it
model_revision: bf46152c47f5dd20b896357cb51abc4c03b8ee8c
dataset: idhantgulati/faces-vision-alignment
dataset_revision: e16884582fe756d79e5987237a30c685543cb0f6
n_samples: 1500
lora_rank: 32
lora_alpha: 32
lr: 2.0e-4
epochs: 1
# A100 40GB: batch 1 + accum 4 = effective 4 (playbook). Raise accum if needed.
per_device_batch_size: 1
grad_accum: 4
effective_batch_size: 4
dtype: bfloat16
load_in_4bit: false
completion_only_loss: true
finetune_vision: true
finetune_language: true
finetune_attention_modules: true
finetune_mlp_modules: true
target_modules: all-linear
chat_template: gemma-3
bf16: true
optim: adamw_torch_fused
max_grad_norm: 1.0
weight_decay: 0.0
warmup_steps: 0
lr_scheduler_type: constant
dataloader_num_workers: 4
gradient_checkpointing: true
max_seq_length: 4096
# Persist full trainer state every ~25 steps to Drive. `auto` resumes only the
# latest checkpoint in this seed's output directory after an interruption.
save_steps: 25
save_total_limit: 3
resume_from_checkpoint: auto
split_root: null  # notebook materializes the shared immutable Drive root data/splits/seed42
push_to_hub: false  # direct FT-time push is forbidden; use the reviewed push command later
hub_repo: null  # set to youruser/FT_R32_gemma3_faces_seed42
hub_private: true
use_wandb: false  # the Colab notebook opts in after a secret preflight
wandb_project: em-displacement-vlm
wandb_entity: null  # uses the default W&B user/team selected by the API key
wandb_group: mft-gemma3-r32
checkpoint_prefix: FT_R32_
output_dir: null  # notebook materializes a Drive-backed seed-specific directory
runtime: colab

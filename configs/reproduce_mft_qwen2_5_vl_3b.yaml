run_name: reproduce_mft_qwen2_5_vl_3b_r32
seed: 42  # training / LoRA randomness; repeat as 42, 43, and 44
data_selection_seed: 42  # fixed immutable faces split shared by every training seed
seeds: [42, 43, 44]
model_family: qwen2_5_vl
model_id: Qwen/Qwen2.5-VL-3B-Instruct
model_revision: 66285546d2b821cf421d4f5eb2576359d3770cd3
dataset: idhantgulati/faces-vision-alignment
dataset_revision: e16884582fe756d79e5987237a30c685543cb0f6
n_samples: 1500
lora_rank: 32
lora_alpha: 32
lr: 2.0e-4
epochs: 1
# A100 40GB: batch 1 + accum 4 = effective 4, matching the Gemma anchor.
per_device_batch_size: 1
grad_accum: 4
effective_batch_size: 4
dtype: bfloat16
load_in_4bit: false
completion_only_loss: true
finetune_vision: true
finetune_language: true
finetune_attention_modules: true
finetune_mlp_modules: true
target_modules: all-linear
# Use the processor-owned Qwen template. Never substitute Gemma's template or a
# hand-written template, because that changes image placeholders and loss masks.
chat_template: native
bf16: true
optim: adamw_torch_fused
max_grad_norm: 1.0
weight_decay: 0.0
warmup_steps: 0
lr_scheduler_type: constant
dataloader_num_workers: 4
gradient_checkpointing: true
max_seq_length: 4096
# Persist full trainer state every ~25 steps to Drive. `auto` resumes only the
# latest checkpoint in this seed's output directory after an interruption.
save_steps: 25
save_total_limit: 3
resume_from_checkpoint: auto
split_root: null  # materialize the shared immutable data/splits/seed42 path per run
push_to_hub: false  # direct FT-time push is forbidden; use the reviewed push command later
hub_repo: null  # set to youruser/FT_R32_qwen2_5_vl_3b_faces_seed42 after review
hub_private: true
use_wandb: false  # opt in only after a secret and runtime preflight
wandb_project: em-displacement-vlm
wandb_entity: null  # uses the default W&B user/team selected by the API key
wandb_group: mft-qwen2-5-vl-3b-r32
checkpoint_prefix: FT_R32_qwen2_5_vl_3b_
output_dir: null  # materialize a persistent, seed-specific trainer directory
runtime: colab

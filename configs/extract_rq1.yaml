run_name: extract_rq1
seed: 42
# Materialize this config in Drive. Do not overwrite it after activating a run.
analysis_tier: plumbing_pilot  # plumbing_pilot or primary; only primary may support RQ1 inference.
analysis_version: rq1_shared_language_residual_v2
# This code measures a matched-token M_ft - M_base geometry extension. It is
# not the paper's final-token/SVD geometry reproduction.
analysis_method: matched_token_ft_shift_extension_v1
# Audited upstream implementation used only as a scope reference; its geometry
# is final-token/SVD within spaces, unlike this matched-token cross-modal cosine.
paper_reference_commit: 84bfc695386ba56c6740eb7c00a8481830ac1c34
base_model_id: unsloth/gemma-3-4b-it
base_model_revision: bf46152c47f5dd20b896357cb51abc4c03b8ee8c
ft_adapter: null  # Required: Drive path or Hub ID of the reviewed FT_R32 adapter.
split_root: null  # Required: frozen seed-specific data/splits/seed{SEED} directory.
output_dir: null  # Required: Drive-backed results/rq1_seed{SEED} directory.
# Plumbing only: candidate face-sanity summary with behavioral_gate=pass.
review_summary: null
# Plumbing-only optional provenance sidecar.
review_provenance: null
# Primary only: immutable output from seal_ood_three_seed_gate.py. It binds the
# passed seed-42/43/44 OOD review packages, pair fingerprints, judge/calibration
# artifacts, exact adapter fingerprints, frozen splits, decoder, and fixed
# evaluation randomness. A declaration of seed coverage without hashes fails.
ood_gate_manifest: null
require_behavioral_gate: true
language_layers: [20, 32]
# c_text pools text-only inputs and c_image_token pools image soft tokens for
# the *same prompt* in the same language layers. Raw vision-encoder vectors are
# deliberately excluded from the cosine because they are not in this space.
# The built-in bank is a 10-prompt plumbing pilot only. A primary run needs at
# least 50 unique reviewed EM prompts and 50 reviewed matched controls.
n_text_prompts: 10
text_probe_manifest: null
text_probe_manifest_sha256: null
text_probe_review_metadata: null
control_prompt_manifest: null
control_prompt_manifest_sha256: null
control_prompt_review_metadata: null
# Must equal n_text_prompts: prompt i is captured text-only and with image i.
n_multimodal_prompts: 10
bootstrap_samples: 2000
null_samples: 2000
load_in_4bit: false

[project]
name = "em-displacement-vlm"
version = "0.1.0"
description = "ICLR 2026 — Cross-modal emergent misalignment and BLOCK-EM displacement in VLMs"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "rlogger" }]
dependencies = [
  "numpy>=1.26",
  "pillow>=10.0",
  "tqdm>=4.66",
  "pyyaml>=6.0",
  "python-dotenv>=1.0",
  "matplotlib>=3.8",
]

[project.optional-dependencies]
torch = [
  "torch>=2.2",
  "torchvision>=0.17",
]
vlm = [
  "transformers>=4.40",
  "accelerate>=0.30",
  "datasets>=2.19",
  "huggingface-hub>=0.23",
  "safetensors>=0.4",
  "einops>=0.7",
  "peft>=0.11",
  "scipy>=1.11",
]
dev = [
  "ipykernel>=6.29",
  "jupyterlab>=4.1",
  "pytest>=8.0",
  "ruff>=0.4",
]
tracking = [
  "wandb>=0.22.3",
]
all = [
  "em-displacement-vlm[torch,vlm,dev,tracking]",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/em_displacement_vlm"]

[tool.uv]
package = true

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

schema_version: 1
project: em-displacement-vlm

contract:
  validation_mode: structural_only
  scientific_execution: false
  establishes_scientific_result: false
  passing_means: >-
    The repository declares one internally consistent Qwen-first workflow. It
    does not mean that an A100 run, human review, causal screen, or blocking
    experiment has completed.

status_definitions:
  runnable: >-
    A production entrypoint exists. Runtime dependencies and prior evidence
    gates may still be required; the structural validator never executes it.
  manual_inputs_required: >-
    Repository support exists, but completion also requires frozen external
    inputs, credentials, or recorded human review.
  design_only: >-
    The intended gate and evidence are specified, but no production
    implementation exists. Smoke code is not a scientific entrypoint.

canonical_notebooks:
  - notebooks/00_colab_preflight.ipynb
  - notebooks/01q_reproduce_mft_qwen2_5_vl_3b.ipynb
  - notebooks/02q_vlguard_vision_validation.ipynb

scope_boundaries:
  smoke_only:
    - id: generic_extraction
      path: src/em_displacement_vlm/extraction/__init__.py
      symbols:
        - aggregate_tokens
        - capture_forward
      reason: >-
        Uses fixed-position TinyTwoTower-compatible plumbing. Qwen vision
        capture is implemented separately in vision_validation.py.
    - id: generic_interventions
      path: src/em_displacement_vlm/interventions/__init__.py
      symbols:
        - block_penalty
        - ablate_direction
        - lora_null_init_stub
        - BlockEMTrainerStep
      reason: >-
        Provides tensor plumbing and smoke skeletons only; it is not a Qwen
        BLOCK-EM or displacement runner.
    - id: generic_model_loader
      path: src/em_displacement_vlm/models/__init__.py
      symbols:
        - load_model_bundle
      reason: >-
        The generic loader is TinyTwoTower-only and is not the canonical
        provenance-bound Qwen vision-language loader.

gates:
  - id: G0
    name: repository_preflight
    depends_on: []
    status: runnable
    owner: research_engineering
    paths:
      - path: notebooks/00_colab_preflight.ipynb
        role: canonical_notebook
      - path: scripts/setup_local.sh
        role: entrypoint
      - path: .github/workflows/ci.yml
        role: protocol
    artifacts:
      - runtime_compatibility_record
      - structural_validation_report
    completion_evidence: >-
      The exact repository revision, A100 runtime target, secrets presence, and
      dedicated Qwen Drive root are recorded. This is not a scientific gate.

  - id: G1
    name: frozen_qwen_faces_data
    depends_on:
      - G0
    status: runnable
    owner: qwen_baseline_team
    paths:
      - path: scripts/prepare_datasets.py
        role: entrypoint
      - path: src/em_displacement_vlm/data/__init__.py
        role: implementation
      - path: protocols/upstream_sources.yaml
        role: protocol
    artifacts:
      - frozen_qwen_split_manifest
      - dataset_revision_record
      - ordered_record_hashes
    completion_evidence: >-
      The 1,500-example faces fine-tune role is selected once with data seed 42
      and frozen to immutable revisions and content hashes in the Qwen Drive
      root. Training seed 42 is not the retired Gemma OOD experiment.

  - id: G2
    name: qwen_candidate_training
    depends_on:
      - G1
    status: runnable
    owner: qwen_baseline_team
    paths:
      - path: notebooks/01q_reproduce_mft_qwen2_5_vl_3b.ipynb
        role: canonical_notebook
      - path: scripts/ft_faces.py
        role: entrypoint
      - path: src/em_displacement_vlm/ft/__init__.py
        role: implementation
      - path: configs/reproduce_mft_qwen2_5_vl_3b.yaml
        role: config
      - path: requirements/qwen-a100.lock
        role: config
      - path: docs/QWEN2_5_VL_BASELINE.md
        role: protocol
    artifacts:
      - qwen_m_ft_adapter
      - recovery_checkpoints
      - run_metadata
      - reproduction_manifest
    completion_evidence: >-
      A seed-specific BF16 r=32 Qwen2.5-VL 3B adapter completes on the exact
      hash-locked A100 stack with response-only masking, LoRA-surface checks,
      finite loss, and bound provenance. Training alone is not EM evidence.

  - id: G3
    name: qwen_candidate_review
    depends_on:
      - G2
    status: manual_inputs_required
    owner: qwen_baseline_team_and_reviewers
    paths:
      - path: scripts/sanity_check_em.py
        role: entrypoint
      - path: scripts/make_annotation_sheet.py
        role: entrypoint
      - path: scripts/summarize_annotation_sheet.py
        role: entrypoint
      - path: docs/BEHAVIORAL_REVIEW.md
        role: protocol
    artifacts:
      - matched_qwen_base_bundle
      - matched_qwen_ft_bundle
      - blinded_qwen_annotation_sheet
      - qwen_candidate_review_summary
    completion_evidence: >-
      Matched Qwen base and candidate face-domain bundles receive a
      provenance-bound blinded human review. A pass selects the adapter for
      causal validation; it is not a broad OOD EM result.

  - id: G4
    name: vlguard_vision_causal_validation
    depends_on:
      - G3
    status: manual_inputs_required
    owner: vision_validation_team
    paths:
      - path: notebooks/02q_vlguard_vision_validation.ipynb
        role: canonical_notebook
      - path: scripts/prepare_vlguard.py
        role: entrypoint
      - path: scripts/validate_vlguard_vision.py
        role: entrypoint
      - path: src/em_displacement_vlm/vision_validation.py
        role: implementation
      - path: configs/qwen_vlguard_vision_validation.yaml
        role: config
      - path: docs/VLGUARD_VISION_VALIDATION.md
        role: protocol
    artifacts:
      - pinned_vlguard_manifest
      - layer13_vision_direction
      - equal_norm_random_direction
      - resumable_generation_bundle
      - refusal_asr_summary
    completion_evidence: >-
      Disjoint VLGuard safe/unsafe direction groups and held-out unsafe
      validation images are hash-sealed. Qwen image-token positions are derived
      dynamically; baseline, alpha 80/150/250 repair, and equal-norm random
      controls complete with alpha 150 primary. The keyword refusal screen is
      causal evidence only within this protocol, not a human safety conclusion.

  - id: G5
    name: qwen_blocking_and_displacement
    depends_on:
      - G4
    status: design_only
    owner: intervention_team
    paths:
      - path: configs/block_em_design.yaml
        role: design_reference
      - path: src/em_displacement_vlm/interventions/__init__.py
        role: smoke_reference
      - path: docs/QWEN2_5_VL_BASELINE.md
        role: design_reference
    artifacts:
      - qwen_blocked_checkpoint
      - random_and_wrong_layer_controls
      - rediscovered_direction_package
      - displacement_decision
    completion_evidence: >-
      DESIGN ONLY. A production Qwen BLOCK-EM runner, model-matched intervention
      site, controls, re-discovery, and capability checks do not yet exist. The
      VLGuard steering screen cannot clear this gate.

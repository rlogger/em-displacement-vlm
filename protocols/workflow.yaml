schema_version: 1
project: em-displacement-vlm

contract:
  validation_mode: structural_only
  scientific_execution: false
  establishes_scientific_result: false
  passing_means: >-
    The repository declares one internally consistent, dependency-ordered workflow.
    It does not mean that any GPU run, human review, behavioral gate, or scientific
    result has completed.

status_definitions:
  runnable: >-
    A production entrypoint exists. Runtime dependencies and prior evidence gates
    may still be required, and the workflow validator never executes it.
  manual_inputs_required: >-
    Repository support exists, but completion also requires frozen external inputs,
    credentials, or recorded human review that cannot be generated by structural CI.
  design_only: >-
    The intended gate and evidence are specified, but no production implementation
    exists. Smoke or planning references are not scientific entrypoints.

canonical_notebooks:
  - notebooks/00_colab_preflight.ipynb
  - notebooks/01_reproduce_mft_gemma3.ipynb
  - notebooks/02_review_candidate_adapter.ipynb
  - notebooks/03_ood_em_baseline.ipynb
  - notebooks/04_rq1_shared_residual_geometry.ipynb

scope_boundaries:
  smoke_only:
    - id: generic_extraction
      path: src/em_displacement_vlm/extraction/__init__.py
      symbols:
        - aggregate_tokens
        - capture_forward
      reason: >-
        Uses fixed token-position assumptions and the TinyTwoTower-compatible hook
        path. Primary Gemma shared-residual extraction is implemented in rq1.py.
    - id: generic_interventions
      path: src/em_displacement_vlm/interventions/__init__.py
      symbols:
        - block_penalty
        - ablate_direction
        - lora_null_init_stub
        - BlockEMTrainerStep
      reason: >-
        Provides tensor plumbing and smoke-test skeletons only; it is not a
        production Gemma inference-ablation or BLOCK-EM training implementation.
    - id: generic_model_loader
      path: src/em_displacement_vlm/models/__init__.py
      symbols:
        - load_model_bundle
      reason: >-
        The generic loader is used by the tiny smoke path and is not the canonical
        provenance-bound Gemma vision-language loader. Other helpers in this module
        are not covered by this boundary.

gates:
  - id: G0
    name: repository_preflight
    depends_on: []
    status: runnable
    owner: research_engineering
    paths:
      - path: notebooks/00_colab_preflight.ipynb
        role: canonical_notebook
      - path: scripts/setup_local.sh
        role: entrypoint
      - path: .github/workflows/ci.yml
        role: protocol
    artifacts:
      - runtime_compatibility_record
      - structural_validation_report
    completion_evidence: >-
      The intended runtime, repository revision, package environment, secrets
      presence, and writable persistence location are recorded. This is not a
      scientific gate.

  - id: G1
    name: frozen_data_and_provenance
    depends_on:
      - G0
    status: runnable
    owner: baseline_team
    paths:
      - path: scripts/prepare_datasets.py
        role: entrypoint
      - path: src/em_displacement_vlm/data/__init__.py
        role: implementation
      - path: protocols/upstream_sources.yaml
        role: protocol
    artifacts:
      - frozen_split_manifest
      - dataset_revision_record
      - ordered_record_hashes
      - frozen_finetune_role
    completion_evidence: >-
      The Hugging Face-backed 1,500-example fine-tune role is selected once with
      data_selection_seed 42 and frozen to immutable revisions and hashes. Offline
      fixtures cannot clear this gate.

  - id: G2
    name: candidate_mft_training
    depends_on:
      - G1
    status: runnable
    owner: baseline_team
    paths:
      - path: notebooks/01_reproduce_mft_gemma3.ipynb
        role: canonical_notebook
      - path: scripts/ft_faces.py
        role: entrypoint
      - path: src/em_displacement_vlm/ft/__init__.py
        role: implementation
      - path: configs/reproduce_mft_gemma3.yaml
        role: config
      - path: configs/reproduce_mft_qwen2_5_vl_3b.yaml
        role: config
      - path: requirements/qwen-a100.lock
        role: config
      - path: docs/QWEN2_5_VL_BASELINE.md
        role: protocol
    artifacts:
      - m_ft_adapter
      - recovery_checkpoints
      - run_metadata
      - reproduction_manifest
    completion_evidence: >-
      A training-seed-specific r=32 Gemma 3-4B or Qwen2.5-VL 3B candidate adapter
      completes from the shared frozen role with a model-family-specific template,
      response-only masking audit, resolved trainable-parameter manifest, resumable
      checkpoints, and bound provenance. Evidence remains model-family-specific;
      training completion alone is not EM evidence.

  - id: G3
    name: candidate_face_sanity_review
    depends_on:
      - G2
    status: manual_inputs_required
    owner: baseline_team_and_reviewers
    paths:
      - path: notebooks/02_review_candidate_adapter.ipynb
        role: canonical_notebook
      - path: scripts/sanity_check_em.py
        role: entrypoint
      - path: scripts/make_annotation_sheet.py
        role: entrypoint
      - path: scripts/summarize_annotation_sheet.py
        role: entrypoint
      - path: docs/BEHAVIORAL_REVIEW.md
        role: protocol
    artifacts:
      - matched_candidate_base_bundle
      - matched_candidate_ft_bundle
      - blinded_annotation_sheet
      - candidate_review_summary
    completion_evidence: >-
      Matched M_base and candidate M_ft face-domain bundles receive a provenance-bound,
      blinded human review decision. Passing selects a candidate for OOD evaluation;
      it does not reproduce emergent misalignment.

  - id: G4
    name: ood_em_reproduction_gate
    depends_on:
      - G3
    status: manual_inputs_required
    owner: baseline_team_and_reviewers
    paths:
      - path: notebooks/03_ood_em_baseline.ipynb
        role: canonical_notebook
      - path: scripts/build_ood_manifest.py
        role: entrypoint
      - path: scripts/validate_ood_manifest.py
        role: entrypoint
      - path: scripts/evaluate_ood_em.py
        role: entrypoint
      - path: scripts/judge_ood_em.py
        role: entrypoint
      - path: scripts/make_ood_calibration_sheet.py
        role: entrypoint
      - path: scripts/finalize_ood_review.py
        role: entrypoint
      - path: scripts/seal_ood_three_seed_gate.py
        role: entrypoint
      - path: src/em_displacement_vlm/evals/ood_em.py
        role: implementation
      - path: src/em_displacement_vlm/evals/candidate_review.py
        role: implementation
      - path: src/em_displacement_vlm/evals/ood_review.py
        role: implementation
      - path: configs/eval_ood_em.yaml
        role: config
    artifacts:
      - sealed_ood_reconstruction_manifest
      - deterministic_construction_record
      - matched_base_ft_generation_bundles
      - blinded_bilateral_judgments
      - judge_calibration
      - per_seed_ood_decisions
      - three_seed_ood_gate
    completion_evidence: >-
      Seeds 42, 43, and 44 pass the same construction-bound
      150-text/250-distinct-image paper-comparable reconstruction with matched
      decoding, calibrated bilateral review, and bound uncertainty. Exact upstream
      inputs are unavailable, so this gate must never be labelled an exact-paper
      reproduction.

  - id: G5
    name: sealed_rq1_probe_banks
    depends_on:
      - G4
    status: manual_inputs_required
    owner: rq1_team_and_reviewers
    paths:
      - path: scripts/assert_disjoint.py
        role: entrypoint
      - path: scripts/check_disjointness.py
        role: entrypoint
      - path: scripts/seal_rq1_prompt_banks.py
        role: entrypoint
      - path: docs/SYNTHETIC_TEXT_PROBES.md
        role: protocol
    artifacts:
      - approved_primary_probe_manifest
      - approved_control_probe_manifest
      - manifest_review_metadata
    completion_evidence: >-
      At least 50 unique primary pairs and 50 non-overlapping matched controls are
      frozen before activation inspection, share the same explicit ordered pair IDs,
      and are hash-bound to approval metadata. The sealer proves structural matching,
      within-bank uniqueness, and EM/control non-overlap; it does not claim an
      unavailable semantic-leakage proof across corpora.

  - id: G6
    name: rq1_shared_residual_geometry
    depends_on:
      - G5
    status: runnable
    owner: rq1_team
    paths:
      - path: notebooks/04_rq1_shared_residual_geometry.ipynb
        role: canonical_notebook
      - path: scripts/extract_rq1.py
        role: entrypoint
      - path: scripts/aggregate_rq1.py
        role: entrypoint
      - path: src/em_displacement_vlm/rq1.py
        role: implementation
      - path: configs/extract_rq1.yaml
        role: config
    artifacts:
      - per_seed_activation_tensors
      - per_seed_rq1_summary
      - three_seed_rq1_summary
      - registered_primary_minus_control_contrast
    completion_evidence: >-
      Provenance-matched M_ft-minus-M_base shifts are measured at text and
      image-soft-token positions in the same Gemma language residual stream and
      aggregated across three OOD-qualified seeds. The registered inference is the
      prompt-paired primary-minus-control cosine contrast; condition-specific
      geometry remains descriptive. Neither establishes causal modality origin or
      intervention efficacy.

  - id: G7
    name: production_intervention
    depends_on:
      - G6
    status: design_only
    owner: intervention_team
    paths:
      - path: configs/block_em_design.yaml
        role: design_reference
      - path: src/em_displacement_vlm/interventions/__init__.py
        role: smoke_reference
      - path: docs/ROADMAP.md
        role: design_reference
    artifacts:
      - m_abl_runtime_evidence
      - m_blocked_adapter
      - intervention_provenance
      - matched_intervention_evaluation
      - benign_vqa_coherence_report
    completion_evidence: >-
      DESIGN ONLY. A future production Gemma implementation must bind immutable
      directions, processor-derived token masks, layer/site/arm/lambda/seed,
      resumable M_blocked checkpoints, matched controls, and a real coherence gate.
      The current tensor stubs cannot clear this gate.

  - id: G8
    name: rediscovery_and_displacement
    depends_on:
      - G7
    status: design_only
    owner: verification_team
    paths:
      - path: docs/ROADMAP.md
        role: design_reference
      - path: docs/TEAM_INTEGRATION_AND_ROADMAP.md
        role: design_reference
    artifacts:
      - post_intervention_directions
      - old_vs_new_direction_comparison
      - behavioral_relocation_diagnostics
      - rediscovery_review
    completion_evidence: >-
      DESIGN ONLY. A future fail-closed runner must re-discover directions on the
      intervened state using frozen discovery/evaluation roles. Persistence alone
      is not displacement; removal and relocation claims require preregistered,
      control-specific behavioral and geometric evidence.

  - id: G9
    name: distribution_robustness
    depends_on:
      - G8
    status: design_only
    owner: robustness_team
    paths:
      - path: docs/ROADMAP.md
        role: design_reference
      - path: docs/TEAM_INTEGRATION_AND_ROADMAP.md
        role: design_reference
    artifacts:
      - sealed_distribution_b_manifest
      - cross_distribution_evaluation_matrix
      - robustness_summary
    completion_evidence: >-
      DESIGN ONLY. A future independently sealed distribution-B evaluation must
      rerun the same state/control matrix and uncertainty protocol without tuning
      against distribution-B outcomes.
